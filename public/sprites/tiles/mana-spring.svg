<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes glow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .animate-pulse { animation: pulse 2s ease-in-out infinite; }
      .animate-glow { animation: glow 3s ease-in-out infinite; }
    </style>
  </defs>
  
  <!-- Base -->
  <rect x="0" y="0" width="64" height="64" class="deep"/>
  
  <!-- Stone ring around spring -->
  <rect x="0" y="0" width="64" height="8" class="stone"/>
  <rect x="0" y="56" width="64" height="8" class="stone"/>
  <rect x="0" y="0" width="8" height="64" class="stone"/>
  <rect x="56" y="0" width="8" height="64" class="stone"/>
  
  <!-- Stone detail -->
  <rect x="2" y="2" width="4" height="4" class="shallow" opacity="0.5"/>
  <rect x="58" y="2" width="4" height="4" class="shallow" opacity="0.5"/>
  <rect x="2" y="58" width="4" height="4" class="shallow" opacity="0.5"/>
  <rect x="58" y="58" width="4" height="4" class="shallow" opacity="0.5"/>
  
  <!-- Spring pool -->
  <rect x="8" y="8" width="48" height="48" class="shallow"/>
  
  <!-- Magical water -->
  <rect x="12" y="12" width="40" height="40" class="abyss" opacity="0.5"/>
  <rect x="16" y="16" width="32" height="32" class="shallow" opacity="0.8"/>
  
  <!-- Animated glow layers -->
  <rect x="20" y="20" width="24" height="24" class="gold" opacity="0.3" class="animate-glow"/>
  <rect x="24" y="24" width="16" height="16" class="gold" opacity="0.5" class="animate-pulse"/>
  <rect x="28" y="28" width="8" height="8" class="parchment" opacity="0.6" class="animate-pulse"/>
  
  <!-- Mana crystals floating -->
  <rect x="14" y="14" width="4" height="4" class="gold" opacity="0.8" class="animate-pulse"/>
  <rect x="46" y="14" width="4" height="4" class="gold" opacity="0.8" class="animate-pulse"/>
  <rect x="14" y="46" width="4" height="4" class="gold" opacity="0.8" class="animate-pulse"/>
  <rect x="46" y="46" width="4" height="4" class="gold" opacity="0.8" class="animate-pulse"/>
  
  <!-- Center mana orb -->
  <rect x="26" y="26" width="4" height="4" class="parchment" opacity="0.9" class="animate-pulse"/>
  <rect x="28" y="28" width="2" height="2" class="gold"/>
  
  <!-- Light rays -->
  <rect x="30" y="8" width="2" height="8" class="gold" opacity="0.3" class="animate-glow"/>
  <rect x="30" y="48" width="2" height="8" class="gold" opacity="0.3" class="animate-glow"/>
  <rect x="8" y="30" width="8" height="2" class="gold" opacity="0.3" class="animate-glow"/>
  <rect x="48" y="30" width="8" height="2" class="gold" opacity="0.3" class="animate-glow"/>
  
  <!-- Sparkles -->
  <rect x="18" y="22" width="2" height="2" class="parchment" opacity="0.8" class="animate-pulse"/>
  <rect x="42" y="36" width="2" height="2" class="parchment" opacity="0.8" class="animate-pulse"/>
  <rect x="22" y="42" width="2" height="2" class="gold" opacity="0.9" class="animate-pulse"/>
  <rect x="38" y="18" width="2" height="2" class="gold" opacity="0.9" class="animate-pulse"/>
  
  <!-- Tile border -->
  <rect x="0" y="0" width="64" height="2" class="gold" opacity="0.4"/>
  <rect x="0" y="0" width="2" height="64" class="gold" opacity="0.4"/>
</svg>