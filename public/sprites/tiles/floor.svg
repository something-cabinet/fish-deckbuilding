<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Base floor -->
  <rect x="0" y="0" width="64" height="64" class="deep"/>
  
  <!-- Floor planks/tiles -->
  <rect x="0" y="0" width="32" height="16" class="shallow"/>
  <rect x="32" y="0" width="32" height="16" class="shallow" opacity="0.8"/>
  <rect x="0" y="16" width="32" height="16" class="shallow" opacity="0.9"/>
  <rect x="32" y="16" width="32" height="16" class="shallow" opacity="0.7"/>
  <rect x="0" y="32" width="32" height="16" class="shallow" opacity="0.8"/>
  <rect x="32" y="32" width="32" height="16" class="shallow" opacity="0.9"/>
  <rect x="0" y="48" width="32" height="16" class="shallow" opacity="0.7"/>
  <rect x="32" y="48" width="32" height="16" class="shallow" opacity="0.8"/>
  
  <!-- Plank lines -->
  <rect x="30" y="0" width="2" height="16" class="abyss" opacity="0.4"/>
  <rect x="30" y="16" width="2" height="16" class="abyss" opacity="0.4"/>
  <rect x="30" y="32" width="2" height="16" class="abyss" opacity="0.4"/>
  <rect x="30" y="48" width="2" height="16" class="abyss" opacity="0.4"/>
  
  <rect x="0" y="14" width="64" height="2" class="abyss" opacity="0.3"/>
  <rect x="0" y="30" width="64" height="2" class="abyss" opacity="0.3"/>
  <rect x="0" y="46" width="64" height="2" class="abyss" opacity="0.3"/>
  
  <!-- Floor details - knots, wear -->
  <rect x="8" y="6" width="4" height="2" class="abyss" opacity="0.3"/>
  <rect x="10" y="4" width="2" height="4" class="abyss" opacity="0.3"/>
  <rect x="40" y="8" width="4" height="2" class="abyss" opacity="0.2"/>
  <rect x="42" y="6" width="2" height="4" class="abyss" opacity="0.2"/>
  
  <rect x="12" y="22" width="4" height="2" class="abyss" opacity="0.3"/>
  <rect x="14" y="20" width="2" height="4" class="abyss" opacity="0.3"/>
  <rect x="48" y="24" width="4" height="2" class="abyss" opacity="0.2"/>
  <rect x="50" y="22" width="2" height="4" class="abyss" opacity="0.2"/>
  
  <rect x="6" y="38" width="4" height="2" class="abyss" opacity="0.2"/>
  <rect x="8" y="36" width="2" height="4" class="abyss" opacity="0.2"/>
  <rect x="44" y="40" width="4" height="2" class="abyss" opacity="0.3"/>
  <rect x="46" y="38" width="2" height="4" class="abyss" opacity="0.3"/>
  
  <rect x="16" y="54" width="4" height="2" class="abyss" opacity="0.3"/>
  <rect x="18" y="52" width="2" height="4" class="abyss" opacity="0.3"/>
  <rect x="52" y="56" width="4" height="2" class="abyss" opacity="0.2"/>
  <rect x="54" y="54" width="2" height="4" class="abyss" opacity="0.2"/>
  
  <!-- Light patches -->
  <rect x="4" y="4" width="8" height="4" class="parchment" opacity="0.1"/>
  <rect x="36" y="20" width="8" height="4" class="parchment" opacity="0.1"/>
  <rect x="8" y="36" width="8" height="4" class="parchment" opacity="0.1"/>
  <rect x="44" y="52" width="8" height="4" class="parchment" opacity="0.1"/>
  
  <!-- Tile border -->
  <rect x="0" y="0" width="64" height="2" class="parchment" opacity="0.2"/>
  <rect x="0" y="0" width="2" height="64" class="parchment" opacity="0.2"/>
</svg>