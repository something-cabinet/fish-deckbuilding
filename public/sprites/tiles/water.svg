<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Base water -->
  <rect x="0" y="0" width="64" height="64" class="deep"/>
  
  <!-- Water pattern - pixelated waves -->
  <rect x="4" y="8" width="8" height="2" class="shallow" opacity="0.6"/>
  <rect x="20" y="16" width="12" height="2" class="shallow" opacity="0.5"/>
  <rect x="40" y="12" width="8" height="2" class="shallow" opacity="0.7"/>
  <rect x="52" y="24" width="8" height="2" class="shallow" opacity="0.4"/>
  
  <rect x="8" y="28" width="10" height="2" class="shallow" opacity="0.5"/>
  <rect x="30" y="32" width="8" height="2" class="shallow" opacity="0.6"/>
  <rect x="48" y="36" width="10" height="2" class="shallow" opacity="0.5"/>
  
  <rect x="12" y="44" width="8" height="2" class="shallow" opacity="0.7"/>
  <rect x="28" y="48" width="12" height="2" class="shallow" opacity="0.4"/>
  <rect x="50" y="52" width="8" height="2" class="shallow" opacity="0.6"/>
  
  <!-- Deeper patches -->
  <rect x="16" y="16" width="4" height="4" class="abyss" opacity="0.5"/>
  <rect x="44" y="40" width="6" height="4" class="abyss" opacity="0.4"/>
  <rect x="8" y="52" width="4" height="4" class="abyss" opacity="0.6"/>
  
  <!-- Light shimmer -->
  <rect x="24" y="8" width="2" height="2" class="parchment" opacity="0.3"/>
  <rect x="36" y="20" width="2" height="2" class="parchment" opacity="0.2"/>
  <rect x="14" y="36" width="2" height="2" class="parchment" opacity="0.3"/>
  <rect x="56" y="44" width="2" height="2" class="parchment" opacity="0.2"/>
  
  <!-- Tile border highlight -->
  <rect x="0" y="0" width="64" height="2" class="shallow" opacity="0.3"/>
  <rect x="0" y="0" width="2" height="64" class="shallow" opacity="0.3"/>
</svg>