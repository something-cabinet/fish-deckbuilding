<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Crab body (wide, flat) -->
  <!-- Carapace -->
  <rect x="8" y="10" width="16" height="10" class="coral"/>
  <rect x="10" y="8" width="12" height="2" class="coral"/>
  <rect x="10" y="20" width="12" height="2" class="coral"/>
  <rect x="12" y="12" width="10" height="6" class="coral-light"/>
  
  <!-- Eyes on stalks -->
  <rect x="11" y="6" width="2" height="3" class="coral"/>
  <rect x="19" y="6" width="2" height="3" class="coral"/>
  <rect x="10" y="4" width="3" height="2" class="coral-light"/>
  <rect x="19" y="4" width="3" height="2" class="coral-light"/>
  <rect x="11" y="5" width="1" height="1" class="abyss"/>
  <rect x="20" y="5" width="1" height="1" class="abyss"/>
  
  <!-- Left claw -->
  <rect x="2" y="12" width="6" height="4" class="coral"/>
  <rect x="0" y="10" width="4" height="3" class="coral-light"/>
  <rect x="0" y="15" width="4" height="3" class="coral-light"/>
  <rect x="1" y="11" width="2" height="1" class="abyss"/>
  <rect x="1" y="16" width="2" height="1" class="abyss"/>
  
  <!-- Right claw -->
  <rect x="24" y="12" width="6" height="4" class="coral"/>
  <rect x="28" y="10" width="4" height="3" class="coral-light"/>
  <rect x="28" y="15" width="4" height="3" class="coral-light"/>
  <rect x="29" y="11" width="2" height="1" class="abyss"/>
  <rect x="29" y="16" width="2" height="1" class="abyss"/>
  
  <!-- Legs -->
  <rect x="10" y="22" width="2" height="3" class="coral"/>
  <rect x="14" y="22" width="2" height="3" class="coral"/>
  <rect x="18" y="22" width="2" height="3" class="coral"/>
  <rect x="20" y="22" width="2" height="3" class="coral"/>
  
  <!-- Mouth -->
  <rect x="15" y="16" width="2" height="1" class="abyss"/>
  
  <!-- Shell details -->
  <rect x="14" y="12" width="1" height="1" class="gold"/>
  <rect x="17" y="12" width="1" height="1" class="gold"/>
  <rect x="14" y="15" width="1" height="1" class="gold"/>
  <rect x="17" y="15" width="1" height="1" class="gold"/>
</svg>