<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Pufferfish body (round, spiky) -->
  <!-- Main body -->
  <rect x="8" y="8" width="16" height="16" class="gold"/>
  <rect x="6" y="10" width="2" height="12" class="gold"/>
  <rect x="24" y="10" width="2" height="12" class="gold"/>
  <rect x="10" y="6" width="12" height="2" class="gold"/>
  <rect x="10" y="24" width="12" height="2" class="gold"/>
  
  <!-- Belly -->
  <rect x="10" y="10" width="12" height="12" class="parchment" opacity="0.4"/>
  
  <!-- Spikes (all around) -->
  <!-- Top spikes -->
  <rect x="12" y="4" width="2" height="3" class="coral"/>
  <rect x="16" y="4" width="2" height="3" class="coral"/>
  <rect x="20" y="4" width="2" height="3" class="coral"/>
  <rect x="10" y="5" width="2" height="2" class="coral-light"/>
  <rect x="22" y="5" width="2" height="2" class="coral-light"/>
  
  <!-- Bottom spikes -->
  <rect x="12" y="25" width="2" height="3" class="coral"/>
  <rect x="16" y="25" width="2" height="3" class="coral"/>
  <rect x="20" y="25" width="2" height="3" class="coral"/>
  <rect x="10" y="25" width="2" height="2" class="coral-light"/>
  <rect x="22" y="25" width="2" height="2" class="coral-light"/>
  
  <!-- Left spikes -->
  <rect x="4" y="12" width="3" height="2" class="coral"/>
  <rect x="4" y="16" width="3" height="2" class="coral"/>
  <rect x="4" y="20" width="3" height="2" class="coral"/>
  <rect x="5" y="10" width="2" height="2" class="coral-light"/>
  <rect x="5" y="22" width="2" height="2" class="coral-light"/>
  
  <!-- Right spikes -->
  <rect x="25" y="12" width="3" height="2" class="coral"/>
  <rect x="25" y="16" width="3" height="2" class="coral"/>
  <rect x="25" y="20" width="3" height="2" class="coral"/>
  <rect x="25" y="10" width="2" height="2" class="coral-light"/>
  <rect x="25" y="22" width="2" height="2" class="coral-light"/>
  
  <!-- Corner spikes -->
  <rect x="6" y="6" width="2" height="2" class="coral"/>
  <rect x="24" y="6" width="2" height="2" class="coral"/>
  <rect x="6" y="24" width="2" height="2" class="coral"/>
  <rect x="24" y="24" width="2" height="2" class="coral"/>
  
  <!-- Eyes -->
  <rect x="12" y="12" width="3" height="3" class="abyss"/>
  <rect x="13" y="13" width="1" height="1" class="parchment"/>
  <rect x="18" y="12" width="3" height="3" class="abyss"/>
  <rect x="19" y="13" width="1" height="1" class="parchment"/>
  
  <!-- Mouth (small o) -->
  <rect x="15" y="18" width="2" height="2" class="coral"/>
  <rect x="16" y="19" width="1" height="1" class="abyss"/>
  
  <!-- Fins -->
  <rect x="8" y="14" width="2" height="4" class="coral-light"/>
  <rect x="22" y="14" width="2" height="4" class="coral-light"/>
  
  <!-- Belly pattern -->
  <rect x="12" y="20" width="1" height="1" class="shallow"/>
  <rect x="14" y="21" width="1" height="1" class="shallow"/>
  <rect x="16" y="21" width="1" height="1" class="shallow"/>
  <rect x="18" y="20" width="1" height="1" class="shallow"/>
</svg>