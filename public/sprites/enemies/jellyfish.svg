<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Jellyfish bell (dome shape) -->
  <rect x="8" y="6" width="16" height="4" class="coral-light"/>
  <rect x="6" y="10" width="20" height="4" class="coral-light"/>
  <rect x="8" y="14" width="16" height="2" class="coral"/>
  
  <!-- Bell inner glow -->
  <rect x="10" y="8" width="12" height="4" class="parchment" opacity="0.5"/>
  <rect x="12" y="10" width="8" height="2" class="gold" opacity="0.7"/>
  
  <!-- Tentacles (hanging down) -->
  <!-- Left tentacles -->
  <rect x="8" y="16" width="2" height="4" class="coral-light"/>
  <rect x="8" y="20" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="8" y="23" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <rect x="11" y="16" width="2" height="5" class="coral-light"/>
  <rect x="11" y="21" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="11" y="24" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <!-- Center tentacles -->
  <rect x="14" y="16" width="2" height="6" class="coral-light"/>
  <rect x="14" y="22" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="14" y="25" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <rect x="17" y="16" width="2" height="5" class="coral-light"/>
  <rect x="17" y="21" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="17" y="24" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <!-- Right tentacles -->
  <rect x="20" y="16" width="2" height="4" class="coral-light"/>
  <rect x="20" y="20" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="20" y="23" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <rect x="23" y="16" width="2" height="5" class="coral-light"/>
  <rect x="23" y="21" width="2" height="3" class="coral" opacity="0.8"/>
  <rect x="23" y="24" width="2" height="2" class="coral-light" opacity="0.6"/>
  
  <!-- Oral arms (thicker inner tentacles) -->
  <rect x="13" y="16" width="1" height="8" class="gold" opacity="0.6"/>
  <rect x="19" y="16" width="1" height="8" class="gold" opacity="0.6"/>
  
  <!-- Top highlight -->
  <rect x="12" y="6" width="8" height="1" class="parchment" opacity="0.8"/>
  
  <!-- Spots on bell -->
  <rect x="10" y="12" width="1" height="1" class="coral"/>
  <rect x="14" y="12" width="1" height="1" class="coral"/>
  <rect x="18" y="12" width="1" height="1" class="coral"/>
  <rect x="22" y="12" width="1" height="1" class="coral"/>
</svg>