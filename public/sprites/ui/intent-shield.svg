<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <rect x="2" y="2" width="28" height="28" class="shallow" opacity="0.2"/>
  <rect x="4" y="4" width="24" height="24" class="shallow" opacity="0.3"/>
  <rect x="6" y="6" width="20" height="20" class="shallow" opacity="0.4"/>
  
  <!-- Shield outer -->
  <rect x="10" y="4" width="12" height="3" class="parchment"/>
  <rect x="7" y="7" width="18" height="3" class="parchment"/>
  <rect x="5" y="10" width="22" height="16" class="parchment"/>
  <rect x="7" y="26" width="18" height="3" class="parchment"/>
  <rect x="10" y="29" width="12" height="3" class="parchment"/>
  
  <!-- Shield inner -->
  <rect x="11" y="8" width="10" height="3" class="shallow"/>
  <rect x="8" y="11" width="16" height="12" class="shallow"/>
  <rect x="11" y="23" width="10" height="3" class="shallow"/>
  
  <!-- Shield center detail -->
  <rect x="14" y="13" width="4" height="10" class="gold"/>
  <rect x="12" y="15" width="8" height="4" class="gold"/>
  
  <!-- Shield highlight -->
  <rect x="7" y="8" width="3" height="3" class="parchment" opacity="0.5"/>
  <rect x="8" y="9" width="2" height="4" class="parchment" opacity="0.3"/>
  
  <!-- Protection sparkles -->
  <rect x="4" y="6" width="2" height="2" class="gold" opacity="0.8"/>
  <rect x="2" y="10" width="2" height="2" class="parchment" opacity="0.6"/>
  <rect x="26" y="6" width="2" height="2" class="gold" opacity="0.8"/>
  <rect x="28" y="10" width="2" height="2" class="parchment" opacity="0.6"/>
  <rect x="4" y="24" width="2" height="2" class="gold" opacity="0.8"/>
  <rect x="2" y="20" width="2" height="2" class="parchment" opacity="0.6"/>
  <rect x="26" y="24" width="2" height="2" class="gold" opacity="0.8"/>
  <rect x="28" y="20" width="2" height="2" class="parchment" opacity="0.6"/>
</svg>