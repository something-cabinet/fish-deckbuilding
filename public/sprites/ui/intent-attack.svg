<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Background circle -->
  <rect x="2" y="2" width="28" height="28" class="coral" opacity="0.2"/>
  <rect x="4" y="4" width="24" height="24" class="coral" opacity="0.3"/>
  <rect x="6" y="6" width="20" height="20" class="coral" opacity="0.4"/>
  
  <!-- Sword blade -->
  <rect x="14" y="4" width="4" height="18" class="parchment"/>
  <rect x="12" y="6" width="2" height="14" class="gold" opacity="0.5"/>
  <rect x="18" y="6" width="2" height="14" class="gold" opacity="0.5"/>
  
  <!-- Sword tip -->
  <rect x="15" y="2" width="2" height="2" class="parchment"/>
  <rect x="14" y="3" width="1" height="1" class="parchment"/>
  <rect x="17" y="3" width="1" height="1" class="parchment"/>
  
  <!-- Sword guard -->
  <rect x="10" y="20" width="12" height="3" class="gold"/>
  <rect x="8" y="21" width="2" height="2" class="gold"/>
  <rect x="22" y="21" width="2" height="2" class="gold"/>
  
  <!-- Sword hilt -->
  <rect x="15" y="23" width="2" height="6" class="parchment"/>
  <rect x="14" y="27" width="4" height="3" class="gold"/>
  
  <!-- Attack indicator lines -->
  <rect x="4" y="8" width="4" height="2" class="coral-light" opacity="0.8"/>
  <rect x="2" y="12" width="4" height="2" class="coral" opacity="0.6"/>
  <rect x="24" y="8" width="4" height="2" class="coral-light" opacity="0.8"/>
  <rect x="26" y="12" width="4" height="2" class="coral" opacity="0.6"/>
</svg>