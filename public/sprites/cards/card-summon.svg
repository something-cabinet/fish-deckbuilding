<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Card background -->
  <rect x="0" y="0" width="120" height="80" class="abyss"/>
  <rect x="2" y="2" width="116" height="76" class="deep"/>
  
  <!-- Card border -->
  <rect x="4" y="4" width="112" height="72" class="gold" opacity="0.5"/>
  <rect x="6" y="6" width="108" height="68" class="abyss"/>
  
  <!-- Inner frame -->
  <rect x="8" y="8" width="104" height="64" class="deep"/>
  
  <!-- Summon icon - magical fish/portal -->
  <!-- Portal base -->
  <rect x="44" y="16" width="20" height="4" class="gold"/>
  <rect x="40" y="20" width="28" height="4" class="gold"/>
  <rect x="38" y="24" width="32" height="20" class="gold"/>
  <rect x="40" y="44" width="28" height="4" class="gold"/>
  <rect x="44" y="48" width="20" height="4" class="gold"/>
  
  <!-- Portal inner -->
  <rect x="46" y="22" width="16" height="4" class="parchment"/>
  <rect x="42" y="26" width="24" height="16" class="parchment"/>
  <rect x="46" y="42" width="16" height="4" class="parchment"/>
  
  <!-- Portal center (void) -->
  <rect x="48" y="28" width="12" height="12" class="deep"/>
  <rect x="50" y="30" width="8" height="8" class="shallow"/>
  
  <!-- Magical sparkles -->
  <rect x="34" y="14" width="4" height="4" class="coral-light" opacity="0.8"/>
  <rect x="30" y="20" width="2" height="2" class="coral" opacity="0.6"/>
  <rect x="32" y="26" width="4" height="2" class="coral-light" opacity="0.7"/>
  <rect x="28" y="32" width="2" height="4" class="coral" opacity="0.5"/>
  <rect x="34" y="38" width="4" height="2" class="coral-light" opacity="0.6"/>
  <rect x="30" y="44" width="2" height="2" class="coral" opacity="0.7"/>
  <rect x="36" y="50" width="4" height="4" class="coral-light" opacity="0.8"/>
  
  <rect x="70" y="14" width="4" height="4" class="coral-light" opacity="0.8"/>
  <rect x="76" y="20" width="2" height="2" class="coral" opacity="0.6"/>
  <rect x="74" y="26" width="4" height="2" class="coral-light" opacity="0.7"/>
  <rect x="80" y="32" width="2" height="4" class="coral" opacity="0.5"/>
  <rect x="74" y="38" width="4" height="2" class="coral-light" opacity="0.6"/>
  <rect x="78" y="44" width="2" height="2" class="coral" opacity="0.7"/>
  <rect x="70" y="50" width="4" height="4" class="coral-light" opacity="0.8"/>
  
  <!-- Top and bottom sparkles -->
  <rect x="52" y="10" width="4" height="2" class="gold" opacity="0.9"/>
  <rect x="56" y="8" width="2" height="4" class="gold" opacity="0.7"/>
  <rect x="50" y="52" width="4" height="2" class="gold" opacity="0.9"/>
  <rect x="56" y="54" width="2" height="4" class="gold" opacity="0.7"/>
  
  <!-- Small summoned fish silhouette in portal -->
  <rect x="52" y="32" width="4" height="2" class="parchment" opacity="0.8"/>
  <rect x="54" y="30" width="2" height="2" class="parchment" opacity="0.8"/>
  <rect x="54" y="34" width="2" height="2" class="parchment" opacity="0.6"/>
  
  <!-- Card title area -->
  <rect x="10" y="62" width="100" height="2" class="gold" opacity="0.3"/>
  
  <!-- Corner decorations -->
  <rect x="10" y="10" width="6" height="2" class="gold"/>
  <rect x="10" y="10" width="2" height="6" class="gold"/>
  <rect x="104" y="10" width="6" height="2" class="gold"/>
  <rect x="108" y="10" width="2" height="6" class="gold"/>
  <rect x="10" y="68" width="6" height="2" class="gold"/>
  <rect x="10" y="64" width="2" height="6" class="gold"/>
  <rect x="104" y="68" width="6" height="2" class="gold"/>
  <rect x="108" y="64" width="2" height="6" class="gold"/>
</svg>