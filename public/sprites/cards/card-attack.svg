<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Card background -->
  <rect x="0" y="0" width="120" height="80" class="abyss"/>
  <rect x="2" y="2" width="116" height="76" class="deep"/>
  
  <!-- Card border -->
  <rect x="4" y="4" width="112" height="72" class="coral" opacity="0.5"/>
  <rect x="6" y="6" width="108" height="68" class="abyss"/>
  
  <!-- Inner frame -->
  <rect x="8" y="8" width="104" height="64" class="deep"/>
  
  <!-- Attack icon - sword/fish tooth -->
  <!-- Sword blade -->
  <rect x="50" y="16" width="8" height="32" class="parchment"/>
  <rect x="48" y="18" width="2" height="28" class="gold" opacity="0.5"/>
  <rect x="58" y="18" width="2" height="28" class="gold" opacity="0.5"/>
  
  <!-- Sword tip -->
  <rect x="52" y="12" width="4" height="4" class="parchment"/>
  <rect x="50" y="14" width="2" height="2" class="parchment"/>
  <rect x="56" y="14" width="2" height="2" class="parchment"/>
  
  <!-- Sword guard -->
  <rect x="44" y="46" width="20" height="4" class="gold"/>
  <rect x="42" y="48" width="2" height="2" class="gold"/>
  <rect x="64" y="48" width="2" height="2" class="gold"/>
  
  <!-- Sword hilt -->
  <rect x="52" y="50" width="4" height="8" class="parchment"/>
  <rect x="50" y="56" width="8" height="4" class="gold"/>
  
  <!-- Attack spark/effect -->
  <rect x="36" y="20" width="4" height="4" class="coral-light" opacity="0.8"/>
  <rect x="32" y="24" width="4" height="2" class="coral" opacity="0.6"/>
  <rect x="38" y="28" width="2" height="4" class="coral-light" opacity="0.7"/>
  
  <rect x="72" y="18" width="4" height="4" class="coral-light" opacity="0.8"/>
  <rect x="76" y="22" width="4" height="2" class="coral" opacity="0.6"/>
  <rect x="70" y="26" width="2" height="4" class="coral-light" opacity="0.7"/>
  
  <!-- Card title area -->
  <rect x="10" y="62" width="100" height="2" class="coral" opacity="0.3"/>
  
  <!-- Corner decorations -->
  <rect x="10" y="10" width="6" height="2" class="coral"/>
  <rect x="10" y="10" width="2" height="6" class="coral"/>
  <rect x="104" y="10" width="6" height="2" class="coral"/>
  <rect x="108" y="10" width="2" height="6" class="coral"/>
  <rect x="10" y="68" width="6" height="2" class="coral"/>
  <rect x="10" y="64" width="2" height="6" class="coral"/>
  <rect x="104" y="68" width="6" height="2" class="coral"/>
  <rect x="108" y="64" width="2" height="6" class="coral"/>
</svg>