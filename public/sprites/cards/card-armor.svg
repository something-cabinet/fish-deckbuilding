<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Card background -->
  <rect x="0" y="0" width="120" height="80" class="abyss"/>
  <rect x="2" y="2" width="116" height="76" class="deep"/>
  
  <!-- Card border -->
  <rect x="4" y="4" width="112" height="72" class="shallow" opacity="0.5"/>
  <rect x="6" y="6" width="108" height="68" class="abyss"/>
  
  <!-- Inner frame -->
  <rect x="8" y="8" width="104" height="64" class="deep"/>
  
  <!-- Shield icon -->
  <!-- Shield outer -->
  <rect x="42" y="14" width="24" height="4" class="parchment"/>
  <rect x="38" y="18" width="32" height="4" class="parchment"/>
  <rect x="36" y="22" width="36" height="28" class="parchment"/>
  <rect x="38" y="50" width="32" height="4" class="parchment"/>
  <rect x="42" y="54" width="24" height="4" class="parchment"/>
  
  <!-- Shield inner -->
  <rect x="42" y="22" width="24" height="4" class="shallow"/>
  <rect x="40" y="26" width="28" height="20" class="shallow"/>
  <rect x="42" y="46" width="24" height="4" class="shallow"/>
  
  <!-- Shield center detail -->
  <rect x="52" y="28" width="4" height="16" class="gold"/>
  <rect x="48" y="32" width="12" height="4" class="gold"/>
  <rect x="50" y="30" width="8" height="2" class="parchment"/>
  <rect x="50" y="40" width="8" height="2" class="parchment"/>
  
  <!-- Shield shine -->
  <rect x="38" y="18" width="4" height="4" class="parchment" opacity="0.5"/>
  <rect x="40" y="22" width="2" height="8" class="parchment" opacity="0.3"/>
  
  <!-- Protection aura -->
  <rect x="30" y="12" width="4" height="4" class="gold" opacity="0.6"/>
  <rect x="26" y="16" width="4" height="2" class="gold" opacity="0.4"/>
  <rect x="74" y="12" width="4" height="4" class="gold" opacity="0.6"/>
  <rect x="78" y="16" width="4" height="2" class="gold" opacity="0.4"/>
  <rect x="30" y="56" width="4" height="4" class="gold" opacity="0.6"/>
  <rect x="26" y="54" width="4" height="2" class="gold" opacity="0.4"/>
  <rect x="74" y="56" width="4" height="4" class="gold" opacity="0.6"/>
  <rect x="78" y="54" width="4" height="2" class="gold" opacity="0.4"/>
  
  <!-- Card title area -->
  <rect x="10" y="62" width="100" height="2" class="shallow" opacity="0.3"/>
  
  <!-- Corner decorations -->
  <rect x="10" y="10" width="6" height="2" class="shallow"/>
  <rect x="10" y="10" width="2" height="6" class="shallow"/>
  <rect x="104" y="10" width="6" height="2" class="shallow"/>
  <rect x="108" y="10" width="2" height="6" class="shallow"/>
  <rect x="10" y="68" width="6" height="2" class="shallow"/>
  <rect x="10" y="64" width="2" height="6" class="shallow"/>
  <rect x="104" y="68" width="6" height="2" class="shallow"/>
  <rect x="108" y="64" width="2" height="6" class="shallow"/>
</svg>