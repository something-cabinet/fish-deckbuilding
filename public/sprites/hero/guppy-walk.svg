<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Frame 1: Walking right, legs forward -->
  <g id="frame1">
    <!-- Tail (wagging) -->
    <rect x="2" y="13" width="4" height="4" class="coral"/>
    <rect x="4" y="11" width="2" height="2" class="coral"/>
    <rect x="4" y="17" width="2" height="2" class="coral"/>
    
    <!-- Body -->
    <rect x="6" y="12" width="10" height="8" class="gold"/>
    <rect x="8" y="10" width="8" height="2" class="gold"/>
    <rect x="8" y="20" width="8" height="2" class="gold"/>
    <rect x="14" y="12" width="6" height="8" class="coral-light"/>
    
    <!-- Eye -->
    <rect x="16" y="14" width="2" height="2" class="abyss"/>
    <rect x="17" y="14" width="1" height="1" class="parchment"/>
    
    <!-- Fins (swimming motion) -->
    <rect x="10" y="8" width="4" height="2" class="coral"/>
    <rect x="10" y="22" width="4" height="2" class="coral"/>
    
    <!-- Mouth -->
    <rect x="20" y="16" width="2" height="2" class="coral"/>
    
    <!-- Movement lines -->
    <rect x="24" y="14" width="2" height="1" class="shallow"/>
    <rect x="26" y="17" width="2" height="1" class="shallow"/>
  </g>
  
  <!-- Frame 2: Mid-stride -->
  <g id="frame2" style="display:none">
    <rect x="2" y="14" width="4" height="4" class="coral"/>
    <rect x="4" y="12" width="2" height="2" class="coral"/>
    <rect x="4" y="18" width="2" height="2" class="coral"/>
    <rect x="6" y="12" width="10" height="8" class="gold"/>
    <rect x="8" y="10" width="8" height="2" class="gold"/>
    <rect x="8" y="20" width="8" height="2" class="gold"/>
    <rect x="14" y="12" width="6" height="8" class="coral-light"/>
    <rect x="16" y="14" width="2" height="2" class="abyss"/>
    <rect x="17" y="14" width="1" height="1" class="parchment"/>
    <rect x="10" y="8" width="4" height="2" class="coral"/>
    <rect x="10" y="22" width="4" height="2" class="coral"/>
    <rect x="20" y="16" width="2" height="2" class="coral"/>
    <rect x="24" y="15" width="2" height="1" class="shallow"/>
    <rect x="26" y="16" width="2" height="1" class="shallow"/>
  </g>
  
  <!-- Frame 3: Other leg forward -->
  <g id="frame3" style="display:none">
    <rect x="2" y="15" width="4" height="4" class="coral"/>
    <rect x="4" y="13" width="2" height="2" class="coral"/>
    <rect x="4" y="19" width="2" height="2" class="coral"/>
    <rect x="6" y="12" width="10" height="8" class="gold"/>
    <rect x="8" y="10" width="8" height="2" class="gold"/>
    <rect x="8" y="20" width="8" height="2" class="gold"/>
    <rect x="14" y="12" width="6" height="8" class="coral-light"/>
    <rect x="16" y="14" width="2" height="2" class="abyss"/>
    <rect x="17" y="14" width="1" height="1" class="parchment"/>
    <rect x="10" y="8" width="4" height="2" class="coral"/>
    <rect x="10" y="22" width="4" height="2" class="coral"/>
    <rect x="20" y="16" width="2" height="2" class="coral"/>
    <rect x="24" y="13" width="2" height="1" class="shallow"/>
    <rect x="26" y="18" width="2" height="1" class="shallow"/>
  </g>
  
  <!-- Frame 4: Return -->
  <g id="frame4" style="display:none">
    <rect x="2" y="14" width="4" height="4" class="coral"/>
    <rect x="4" y="12" width="2" height="2" class="coral"/>
    <rect x="4" y="18" width="2" height="2" class="coral"/>
    <rect x="6" y="12" width="10" height="8" class="gold"/>
    <rect x="8" y="10" width="8" height="2" class="gold"/>
    <rect x="8" y="20" width="8" height="2" class="gold"/>
    <rect x="14" y="12" width="6" height="8" class="coral-light"/>
    <rect x="16" y="14" width="2" height="2" class="abyss"/>
    <rect x="17" y="14" width="1" height="1" class="parchment"/>
    <rect x="10" y="8" width="4" height="2" class="coral"/>
    <rect x="10" y="22" width="4" height="2" class="coral"/>
    <rect x="20" y="16" width="2" height="2" class="coral"/>
    <rect x="24" y="16" width="2" height="1" class="shallow"/>
    <rect x="26" y="15" width="2" height="1" class="shallow"/>
  </g>
</svg>