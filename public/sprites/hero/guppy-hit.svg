<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Frame 1: Impact flash -->
  <g id="frame1">
    <!-- Hit flash overlay -->
    <rect x="0" y="0" width="32" height="32" fill="#ffffff" opacity="0.3"/>
    
    <!-- Body (recoiling back) -->
    <rect x="4" y="12" width="10" height="8" class="gold"/>
    <rect x="6" y="10" width="8" height="2" class="gold"/>
    <rect x="6" y="20" width="8" height="2" class="gold"/>
    <rect x="12" y="12" width="6" height="8" class="coral-light"/>
    
    <!-- Eye (squinting/damaged) -->
    <rect x="14" y="15" width="3" height="1" class="abyss"/>
    
    <!-- Fins (flailing) -->
    <rect x="8" y="7" width="3" height="3" class="coral"/>
    <rect x="8" y="22" width="3" height="3" class="coral"/>
    
    <!-- Mouth (grimace) -->
    <rect x="18" y="15" width="2" height="2" class="coral"/>
    
    <!-- Damage indicators -->
    <rect x="20" y="10" width="2" height="2" class="coral"/>
    <rect x="22" y="8" width="2" height="2" class="coral-light"/>
    <rect x="24" y="6" width="2" height="2" class="coral"/>
  </g>
  
  <!-- Frame 2: Knockback -->
  <g id="frame2" style="display:none">
    <!-- Body (tilted back) -->
    <rect x="2" y="11" width="10" height="8" class="gold"/>
    <rect x="4" y="9" width="8" height="2" class="gold"/>
    <rect x="4" y="19" width="8" height="2" class="gold"/>
    <rect x="10" y="11" width="6" height="8" class="coral-light"/>
    
    <!-- Eye (closed/dizzy) -->
    <rect x="12" y="14" width="3" height="1" class="abyss"/>
    <rect x="13" y="13" width="1" height="1" class="coral"/>
    <rect x="15" y="13" width="1" height="1" class="coral"/>
    
    <!-- Fins (wild) -->
    <rect x="6" y="6" width="4" height="3" class="coral"/>
    <rect x="6" y="23" width="4" height="3" class="coral"/>
    
    <!-- Mouth (open in pain) -->
    <rect x="16" y="14" width="3" height="3" class="coral"/>
    <rect x="17" y="15" width="1" height="1" class="parchment"/>
    
    <!-- Stars/dizzy -->
    <rect x="20" y="8" width="2" height="2" class="gold"/>
    <rect x="22" y="6" width="1" height="1" class="gold"/>
    <rect x="23" y="8" width="1" height="1" class="gold"/>
    <rect x="22" y="10" width="1" height="1" class="gold"/>
    <rect x="21" y="9" width="1" height="1" class="gold"/>
  </g>
  
  <!-- Frame 3: Reeling -->
  <g id="frame3" style="display:none">
    <rect x="3" y="12" width="10" height="8" class="gold"/>
    <rect x="5" y="10" width="8" height="2" class="gold"/>
    <rect x="5" y="20" width="8" height="2" class="gold"/>
    <rect x="11" y="12" width="6" height="8" class="coral-light"/>
    
    <!-- Eye (X for dizzy) -->
    <rect x="13" y="14" width="1" height="1" class="abyss"/>
    <rect x="14" y="15" width="1" height="1" class="abyss"/>
    <rect x="15" y="14" width="1" height="1" class="abyss"/>
    <rect x="13" y="15" width="1" height="1" class="abyss"/>
    <rect x="15" y="15" width="1" height="1" class="abyss"/>
    
    <!-- Fins -->
    <rect x="7" y="7" width="4" height="3" class="coral"/>
    <rect x="7" y="22" width="4" height="3" class="coral"/>
    
    <!-- Mouth -->
    <rect x="17" y="15" width="2" height="2" class="coral"/>
    
    <!-- Dizzy circles -->
    <rect x="19" y="9" width="2" height="2" class="shallow"/>
    <rect x="21" y="7" width="2" height="2" class="shallow"/>
    <rect x="23" y="9" width="2" height="2" class="shallow"/>
  </g>
  
  <!-- Frame 4: Recovering -->
  <g id="frame4" style="display:none">
    <rect x="5" y="12" width="10" height="8" class="gold"/>
    <rect x="7" y="10" width="8" height="2" class="gold"/>
    <rect x="7" y="20" width="8" height="2" class="gold"/>
    <rect x="13" y="12" width="6" height="8" class="coral-light"/>
    
    <!-- Eye (half open) -->
    <rect x="15" y="14" width="2" height="2" class="abyss"/>
    <rect x="16" y="14" width="1" height="1" class="parchment"/>
    
    <!-- Fins (drooping) -->
    <rect x="9" y="9" width="3" height="2" class="coral"/>
    <rect x="9" y="21" width="3" height="2" class="coral"/>
    
    <!-- Mouth (small) -->
    <rect x="19" y="16" width="1" height="1" class="coral"/>
  </g>
</svg>