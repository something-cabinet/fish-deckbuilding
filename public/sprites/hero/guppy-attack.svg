<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .abyss { fill: #0a1628; }
      .deep { fill: #0f2236; }
      .coral { fill: #e85d4e; }
      .gold { fill: #f4c430; }
      .parchment { fill: #e8dcc5; }
      .shallow { fill: #1a3a5c; }
      .coral-light { fill: #ff6b5e; }
    </style>
  </defs>
  
  <!-- Frame 1: Wind-up -->
  <g id="frame1">
    <!-- Tail (curled back) -->
    <rect x="0" y="14" width="4" height="4" class="coral"/>
    <rect x="2" y="12" width="2" height="2" class="coral"/>
    <rect x="2" y="18" width="2" height="2" class="coral"/>
    <rect x="4" y="10" width="2" height="2" class="coral"/>
    <rect x="4" y="20" width="2" height="2" class="coral"/>
    
    <!-- Body (compressed) -->
    <rect x="6" y="12" width="8" height="8" class="gold"/>
    <rect x="8" y="10" width="6" height="2" class="gold"/>
    <rect x="8" y="20" width="6" height="2" class="gold"/>
    <rect x="12" y="12" width="6" height="8" class="coral-light"/>
    
    <!-- Eye (focused) -->
    <rect x="14" y="14" width="2" height="2" class="abyss"/>
    <rect x="15" y="14" width="1" height="1" class="parchment"/>
    
    <!-- Fins (tucked) -->
    <rect x="8" y="8" width="3" height="2" class="coral"/>
    <rect x="8" y="22" width="3" height="2" class="coral"/>
    
    <!-- Mouth (closed, determined) -->
    <rect x="18" y="16" width="1" height="1" class="coral"/>
  </g>
  
  <!-- Frame 2: Lunge forward -->
  <g id="frame2" style="display:none">
    <!-- Tail (straight back) -->
    <rect x="4" y="14" width="4" height="4" class="coral"/>
    <rect x="6" y="12" width="2" height="2" class="coral"/>
    <rect x="6" y="18" width="2" height="2" class="coral"/>
    
    <!-- Body (stretched) -->
    <rect x="8" y="12" width="12" height="8" class="gold"/>
    <rect x="10" y="10" width="10" height="2" class="gold"/>
    <rect x="10" y="20" width="10" height="2" class="gold"/>
    <rect x="16" y="12" width="8" height="8" class="coral-light"/>
    
    <!-- Eye (forward) -->
    <rect x="20" y="14" width="2" height="2" class="abyss"/>
    <rect x="21" y="14" width="1" height="1" class="parchment"/>
    
    <!-- Fins (back) -->
    <rect x="12" y="8" width="4" height="2" class="coral"/>
    <rect x="12" y="22" width="4" height="2" class="coral"/>
    
    <!-- Mouth (open, biting) -->
    <rect x="24" y="15" width="3" height="2" class="coral"/>
    <rect x="26" y="14" width="2" height="1" class="coral-light"/>
    <rect x="26" y="17" width="2" height="1" class="coral-light"/>
    
    <!-- Speed lines -->
    <rect x="28" y="13" width="2" height="1" class="shallow"/>
    <rect x="28" y="18" width="2" height="1" class="shallow"/>
  </g>
  
  <!-- Frame 3: Strike impact -->
  <g id="frame3" style="display:none">
    <!-- Tail -->
    <rect x="6" y="14" width="4" height="4" class="coral"/>
    <rect x="8" y="12" width="2" height="2" class="coral"/>
    <rect x="8" y="18" width="2" height="2" class="coral"/>
    
    <!-- Body -->
    <rect x="10" y="12" width="12" height="8" class="gold"/>
    <rect x="12" y="10" width="10" height="2" class="gold"/>
    <rect x="12" y="20" width="10" height="2" class="gold"/>
    <rect x="18" y="12" width="8" height="8" class="coral-light"/>
    
    <!-- Eye -->
    <rect x="22" y="14" width="2" height="2" class="abyss"/>
    <rect x="23" y="14" width="1" height="1" class="parchment"/>
    
    <!-- Fins -->
    <rect x="14" y="8" width="4" height="2" class="coral"/>
    <rect x="14" y="22" width="4" height="2" class="coral"/>
    
    <!-- Mouth (bite) -->
    <rect x="26" y="15" width="3" height="2" class="coral"/>
    <rect x="28" y="14" width="2" height="1" class="coral-light"/>
    <rect x="28" y="17" width="2" height="1" class="coral-light"/>
    
    <!-- Impact star -->
    <rect x="29" y="12" width="2" height="1" class="gold"/>
    <rect x="29" y="19" width="2" height="1" class="gold"/>
    <rect x="30" y="14" width="1" height="4" class="gold"/>
  </g>
  
  <!-- Frame 4: Recovery -->
  <g id="frame4" style="display:none">
    <rect x="4" y="14" width="4" height="4" class="coral"/>
    <rect x="6" y="12" width="2" height="2" class="coral"/>
    <rect x="6" y="18" width="2" height="2" class="coral"/>
    <rect x="8" y="12" width="10" height="8" class="gold"/>
    <rect x="10" y="10" width="8" height="2" class="gold"/>
    <rect x="10" y="20" width="8" height="2" class="gold"/>
    <rect x="16" y="12" width="6" height="8" class="coral-light"/>
    <rect x="18" y="14" width="2" height="2" class="abyss"/>
    <rect x="19" y="14" width="1" height="1" class="parchment"/>
    <rect x="12" y="8" width="4" height="2" class="coral"/>
    <rect x="12" y="22" width="4" height="2" class="coral"/>
    <rect x="22" y="16" width="2" height="2" class="coral"/>
  </g>
</svg>