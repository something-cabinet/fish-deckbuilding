name: "Rust toolchain"
description: "Install Rust toolchain with caching"

inputs:
  toolchain:
    required: false
    description: "Rust toolchain (e.g. 'stable', 'nightly'). Auto-detected from rust-toolchain.toml if unset."
    default: ""

  components:
    required: false
    description: "Additional components to install (e.g. 'clippy')"
    default: ""

  cache-key:
    required: false
    description: "Extra suffix for the cache shared-key"
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Install Rust toolchain"
      shell: bash
      run: |
        if [ -n "${{ inputs.toolchain }}" ]; then
          TOOLCHAIN="${{ inputs.toolchain }}"
        elif [ -f rust-toolchain.toml ]; then
          TOOLCHAIN="$(grep '^channel' rust-toolchain.toml | sed 's/.*"\(.*\)"/\1/')"
        elif [ -f rust-toolchain ]; then
          TOOLCHAIN="$(cat rust-toolchain)"
        else
          TOOLCHAIN="stable"
        fi
        echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV

        RETRY=3
        for i in $(seq 1 $RETRY); do
          rustup toolchain install "$TOOLCHAIN" --profile minimal --no-self-update ${{ inputs.components && format('--component {0}', inputs.components) || '' }} && break
          if [ $i -eq $RETRY ]; then exit 1; fi
          sleep 5
        done
        rustup default "$TOOLCHAIN"

    - name: "Set up sccache"
      uses: mozilla-actions/sccache-action@v0.0.10

    - name: "Extract Rust version for cache key"
      shell: bash
      run: |
        version=$(rustc --version)
        if echo "$version" | grep -q "nightly"; then
          key=$(echo "$version" | sed -E 's/rustc ([0-9]+\.[0-9]+\.[0-9]+)-nightly \(([a-f0-9]+) .*/\1-nightly-\2/')
        else
          key=$(echo "$version" | sed -E 's/rustc ([0-9]+\.[0-9]+\.[0-9]+) .*/\1-stable/')
        fi
        echo "RUST_CACHE_KEY=$key" >> $GITHUB_ENV

    - name: "Reuse cached dependencies"
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: "${{ runner.os }}-${{ env.RUST_CACHE_KEY }}${{ inputs.cache-key && format('-{0}', inputs.cache-key) || '' }}"
        cache-on-failure: true
        workspaces: "rust -> target"

    - name: "Set Rust environment variables"
      shell: bash
      run: |
        echo "CARGO_TERM_COLOR=always" >> $GITHUB_ENV
        echo "CARGO_INCREMENTAL=0" >> $GITHUB_ENV
        echo "RUST_BACKTRACE=short" >> $GITHUB_ENV
        rustc --version --verbose
